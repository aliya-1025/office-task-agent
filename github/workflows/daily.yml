# Isse repo me .github/workflows/daily.yml naam se rakho
name: Daily Points Agent
on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 11:30 PM IST roz
  workflow_dispatch: {}     # manual run ke liye
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python points_agent.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          LOG_SHEET_ID: ${{ secrets.LOG_SHEET_ID }}
          REPORT_SHEET_ID: ${{ secrets.REPORT_SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BOSS_EMAIL: ${{ secrets.BOSS_EMAIL }}
